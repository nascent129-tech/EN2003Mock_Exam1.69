<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EN2003 Final Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* VOICE: calm, minimal study sheet — large text, no clutter
   IDEA: a two-sided revision card: short notes on one side, a 50-item paper on the other
   PICTURE: the working tool itself (notes / exam) directly under a modest title
   COLOUR and TYPE: white ground, oxford blue for structure, magenta only for score; IBM Plex Sans Thai + Red Hat Display
   LAYOUT: one 760px column, sticky tab bar, stacks naturally on phones */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0b1220);--soft:light-dark(#f4f6fb,#131c2e);--line:light-dark(#dfe4ee,#26324a);
  --ink:light-dark(#111827,#e8ecf4);--muted:light-dark(#5b6476,#9aa6bb);
  --blue:light-dark(#0b1f4b,#9db7ff);--blue-soft:light-dark(#e8edf8,#1a2645);--on-blue:light-dark(#ffffff,#0b1220);
  --hot:light-dark(#c8104f,#ff6b9b);
  --ok:light-dark(#137a48,#5cd394);--ok-soft:light-dark(#e3f4ea,#12301f);
  --bad:light-dark(#b42318,#ff8a80);--bad-soft:light-dark(#fdecea,#3a1a18)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:18px}
html{scroll-padding-top:130px}

header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 10px;flex-wrap:wrap}
.logo{font-family:"Red Hat Display",sans-serif;font-size:22px;color:var(--blue);letter-spacing:.01em}
.logo small{font-family:"IBM Plex Sans Thai",sans-serif;font-weight:500;font-size:15px;color:var(--muted);margin-left:8px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 18px;font-size:16px;font-weight:600;min-height:44px}
.tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
@media(max-width:520px){.tabs{width:100%;margin:0}.tab{flex:1}}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}

main{padding-block:26px 90px}
h1{font-family:"Red Hat Display","IBM Plex Sans Thai",sans-serif;font-size:clamp(28px,6vw,38px);line-height:1.15;margin:0 0 6px;color:var(--blue);text-wrap:balance}
.lead{margin:0 0 22px;color:var(--muted);font-size:17px}

/* part switch */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:22px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;min-height:56px;text-align:center;line-height:1.3}
.seg button b{display:block;font-size:16px}
.seg button span{font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft)}
.seg button[aria-pressed=true] b{color:var(--blue)}

/* notes */
.note{border-bottom:1px solid var(--line);padding:16px 2px}
.note:first-child{padding-top:4px}
.note h3{margin:0 0 6px;font-size:19px;line-height:1.35}
.note ul{margin:0;padding-left:20px}
.note li{margin:2px 0}
.note li::marker{color:var(--blue)}
.ex{display:block;margin-top:6px;padding:6px 12px;background:var(--soft);border-radius:8px;font-size:17px}
.ex b{color:var(--blue)}
.vocab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 18px;margin:0}
.vocab dt{font-weight:600}.vocab dd{margin:0;color:var(--muted)}
@media(max-width:520px){.vocab{grid-template-columns:1fr}.vocab dd{margin-bottom:6px}}
.go{display:flex;justify-content:center;margin-top:28px}

/* exam */
.parth{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:34px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--blue)}
.parth:first-of-type{margin-top:6px}
.parth h2{margin:0;font-size:22px;color:var(--blue)}
.parth span{color:var(--muted);font-size:15px}
.q{padding:16px 0 18px;border-bottom:1px solid var(--line)}
.stem{display:grid;grid-template-columns:36px minmax(0,1fr);gap:6px;font-size:19px;font-weight:500;margin-bottom:12px}
.stem .n{color:var(--blue);font-weight:700}
.stem .ln{display:block}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);margin:0 4px;transform:translateY(-4px)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-left:42px}
.opts.long{grid-template-columns:1fr}
@media(max-width:560px){.opts{grid-template-columns:1fr;padding-left:0}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:48px;font-size:17px;line-height:1.45}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt:hover{border-color:var(--blue)}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed=true] .k{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.done .opt{cursor:default}.done .opt:hover{border-color:var(--line)}
.opt.r{border-color:var(--ok);background:var(--ok-soft)}.opt.r .k{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.w{border-color:var(--bad);background:var(--bad-soft)}.opt.w .k{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.why{margin:12px 0 0 42px;font-size:16.5px;padding:10px 14px;background:var(--soft);border-radius:10px;line-height:1.6}
.why .exp{margin-top:4px;color:var(--ink)}
.why b{color:var(--ok)}
.why.miss b{color:var(--bad)}
@media(max-width:560px){.why{margin-left:0}}

.btn{border:1px solid var(--blue);background:var(--bg);color:var(--blue);border-radius:12px;padding:10px 22px;font-size:17px;font-weight:600;min-height:48px}
.btn.main{background:var(--blue);color:var(--on-blue)}
.warn{margin-top:22px;border:1px solid var(--hot);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.warn .row{display:flex;gap:8px;flex-wrap:wrap}

.score{border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:8px;display:grid;gap:14px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:"Red Hat Display",sans-serif;font-size:clamp(52px,12vw,68px);line-height:1;color:var(--hot)}
.big span{font-size:20px;color:var(--muted)}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pt{background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.35}
.pt small{display:block;color:var(--muted);font-size:14px}
.pt b{font-size:22px}
@media(max-width:520px){.parts{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  <div class="wrap top">
    <div class="logo">EN2003<small>ปลายภาค 1/2569</small></div>

</header>
<main class="wrap" id="app"></main>

  ["I'll … (เสนอ / ตัดสินใจทันที)",["ตัดสินใจตอนพูด → will + V1"],"The phone is ringing. <b>I'll get</b> it."],

const PARTS=[
 {id:"g",name:"Part I: Grammar",th:"ไวยากรณ์",qs:[
  ["The printers ___ in Room 2 today. They're in the IT office.",["aren't","isn't","don't","doesn't"],"ช่องว่างไม่มีกริยาแท้ (in Room 2 แค่บอกสถานที่) จึงต้องใช้ verb to be ใช้ don't / doesn't ไม่ได้\nประธาน The printers เป็นพหูพจน์ (มี s) → aren't · isn't ใช้กับเอกพจน์"],
  ["Mr. and Mrs. Tanaka run a small hotel. ___ hotel is near the train station.",["Their","They're","His","Our"],"Mr. and Mrs. Tanaka = 2 คน = they → คำแสดงความเป็นเจ้าของคือ their (โรงแรมของพวกเขา)\nThey're = They are ไม่ได้แสดงความเป็นเจ้าของ · His ใช้กับผู้ชายคนเดียว · Our = ของพวกเรา"],
  ["Ploy works for ___ online shop in Bangkok.",["an","a","some","any"],"ดูที่ “เสียง” แรกของคำถัดไป: online ออกเสียง “ออน” เป็นเสียงสระ → an\nsome / any ใช้กับพหูพจน์หรือนามนับไม่ได้ แต่ shop เป็นเอกพจน์"],
  ["The ___ meeting room is on the third floor. All the managers use it.",["managers'","manager's","manager","managers"],"คำใบ้ “All the managers use it” = ห้องประชุมเป็นของผู้จัดการหลายคน\nเจ้าของหลายคน (ลงท้าย s) → ใส่ ' หลัง s = managers' · manager's = ของผู้จัดการคนเดียว"],
  ["We tested the new software last month. Don't worry, it ___ make our work faster.",["will","won't","might","is"],"คำใบ้ “We tested … Don't worry” = ทดสอบแล้ว มั่นใจว่างานจะเร็วขึ้น → will\nmight = อาจจะ (ยังไม่แน่ใจ) · won't = จะไม่ ซึ่งขัดกับ Don't worry"],

  ["We usually get more orders ___ winter.",["in","on","at","to"],"winter เป็นฤดู → in (in winter, in summer)\non ใช้กับวัน (on Monday) · at ใช้กับเวลา (at 3 p.m.)"],

/* place correct answers evenly across A–D with a fixed shuffle (same on every visit) */
let seed=2569;const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
const Q=[];
PARTS.forEach(p=>{
  const pos=p.qs.map((_,i)=>i%4);
  for(let i=pos.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]];}
  p.from=Q.length;
  p.qs.forEach((it,i)=>{const o=it[1].slice(1);o.splice(pos[i],0,it[1][0]);Q.push({q:it[0],o,a:pos[i],e:it[2],p:p.id});});
  p.to=Q.length;
});

/* ================= STATE (not saved: refresh = start over) ================= */
let S={view:"notes",part:0,ans:{},done:false,wrongOnly:false};
const app=document.getElementById("app"),bar=document.getElementById("bar");
const L="ABCD";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const stem=s=>s.split("\n").map(l=>`<span class="ln">${esc(l).replace(/___/g,'<span class="blank"></span>')}</span>`).join("");
const count=()=>Object.keys(S.ans).length;
const score=id=>Q.reduce((n,q,i)=>n+((!id||q.p===id)&&S.ans[i]===q.a?1:0),0);

function setBar(){bar.style.width=S.view==="exam"?(S.done?100:count()/50*100)+"%":"0";}

function renderNotes(){
  const p=NOTES[S.part];
  let body;
  if(p.id==="v"){
    body=p.items.map(([t,list])=>`<div class="note"><h3>${t}</h3><dl class="vocab">${list.map(([w,m])=>`<dt>${w}</dt><dd>${m}</dd>`).join("")}</dl></div>`).join("");
  }else{
    body=p.items.map(([t,rules,ex])=>`<div class="note"><h3>${t}</h3><ul>${rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>${ex?`<span class="ex">${ex}</span>`:""}</div>`).join("");
  }
  app.innerHTML=`<h1>สรุปเนื้อหา</h1><p class="lead">หัวข้อที่ออกสอบปลายภาค · ปรนัย 4 ตัวเลือก 50 ข้อ</p>
  <div class="seg">${NOTES.map((n,i)=>`<button data-part="${i}" aria-pressed="${i===S.part}"><b>${n.name}</b><span>${n.th}</span></button>`).join("")}</div>
  <section>${body}</section>
  <div class="go"><button class="btn main" data-view="exam">ไปทำ Mock Exam →</button></div>`;
}

function qHTML(q,i){
  const long=q.o.some(o=>o.length>28);
  const u=S.ans[i];
  return `<div class="q ${S.done?"done":""}" id="q${i}">
    <div class="stem"><span class="n">${i+1}.</span><div>${stem(q.q)}</div></div>
    <div class="opts ${long?"long":""}">${q.o.map((o,k)=>{
      let c="opt";if(S.done){if(k===q.a)c+=" r";else if(u===k)c+=" w";}
      return `<button class="${c}" data-q="${i}" data-k="${k}" aria-pressed="${!S.done&&u===k}" ${S.done?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>
    ${S.done?`<div class="why ${u===q.a?"":"miss"}"><b>${u===undefined?"ไม่ได้ตอบ":u===q.a?"ถูก":"ผิด"}</b> · เฉลย ${L[q.a]}. ${esc(q.o[q.a])}<div class="exp">${esc(q.e).replace(/\n/g,"<br>")}</div></div>`:""}
  </div>`;
}

function renderExam(){
  let h="";
  if(S.done){
    const t=score(),wrong=50-t;
    h+=`<div class="score"><div class="big"><b>${t}</b><span>/ 50 คะแนน</span></div>
      <div class="parts">${PARTS.map(p=>`<div class="pt"><small>${p.name.replace(/Part \w+: /,"")}</small><b>${score(p.id)}</b> / ${p.to-p.from}</div>`).join("")}</div>
      <div class="row">${wrong?`<button class="btn" id="filter">${S.wrongOnly?"ดูทุกข้อ":`ดูเฉพาะข้อที่ผิด (${wrong})`}</button>`:""}<button class="btn main" id="again">ทำใหม่</button></div></div>`;
  }else{
    h+=`<h1>Mock Exam</h1><p class="lead">50 ข้อ · Grammar 25 · Vocabulary 15 · Language Function 10</p>`;
  }
  PARTS.forEach(p=>{
    let items="";
    for(let i=p.from;i<p.to;i++){if(S.done&&S.wrongOnly&&S.ans[i]===Q[i].a)continue;items+=qHTML(Q[i],i);}
    if(items)h+=`<div class="parth"><h2>${p.name}</h2><span>ข้อ ${p.from+1}–${p.to} · ${p.th}</span></div>`+items;
  });
  if(!S.done)h+=`<div id="warnHost"></div><div class="go"><button class="btn main" id="submit">ส่งคำตอบ</button></div>`;
  app.innerHTML=h;
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===S.view));
  S.view==="notes"?renderNotes():renderExam();
  setBar();
}
function go(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0);}
function finish(){S.done=true;S.wrongOnly=false;render();window.scrollTo(0,0);}

document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");if(v){go(v.dataset.view);return;}
  const pt=e.target.closest("[data-part]");if(pt){S.part=+pt.dataset.part;render();return;}
  const o=e.target.closest(".opt[data-q]");
  if(o&&!S.done){const i=+o.dataset.q,k=+o.dataset.k;S.ans[i]=k;
    o.parentElement.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.k===k));setBar();return;}
  const id=e.target.closest("button")?.id;
  if(id==="submit"){
    const left=50-count();if(!left)return finish();
    const first=Q.findIndex((_,i)=>S.ans[i]===undefined);
    document.getElementById("warnHost").innerHTML=`<div class="warn"><div>ยังไม่ได้ตอบอีก <b>${left}</b> ข้อ</div><div class="row"><button class="btn" id="toMiss">ไปข้อ ${first+1}</button><button class="btn main" id="force">ส่งเลย</button></div></div>`;
    document.getElementById("toMiss").onclick=()=>document.getElementById("q"+first).scrollIntoView({behavior:"smooth"});
    document.getElementById("force").onclick=finish;
    return;
  }
  if(id==="filter"){S.wrongOnly=!S.wrongOnly;render();return;}
  if(id==="again"){S.ans={};S.done=false;S.wrongOnly=false;render();window.scrollTo(0,0);}
});
const startView=()=>{const h=location.hash.slice(1);S.view=h==="exam"?"exam":"notes";render();};
window.addEventListener("hashchange",startView);
startView();
}
</script>
</body>
</html>
